jenkins:
  systemMessage: "Sprout CI/CD - configured by Jenkins Configuration as Code (ci/jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          # SonarQube runs next to Jenkins (ci/docker-compose.jenkins.yml)
          - key: SONAR_HOST_URL
            value: "http://sonarqube:9000"
          - key: SONAR_PUBLIC_URL
            value: "http://localhost:${SONAR_PORT:-9002}"
          # Docker Hub namespace for images. Empty = images stay local and the Push stage is skipped.
          - key: DOCKERHUB_USER
            value: "${DOCKERHUB_USER:-}"
          - key: SPROUT_SCANNER_HOME
            value: "/opt/sonar-scanner"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sprout-db-password
              description: "Postgres password used by the deployed Sprout stack"
              secret: "${SPROUT_DB_PASSWORD}"
          - string:
              scope: GLOBAL
              id: sonar-token
              description: "Project analysis token for the limited SonarQube CI user"
              secret: "${SPROUT_SONAR_TOKEN:-}"
          - usernamePassword:
              scope: GLOBAL
              id: registry-credentials
              description: "Docker Hub username + access token (Push stage)"
              username: "${DOCKERHUB_USER:-}"
              password: "${DOCKERHUB_TOKEN:-}"

unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: >
      pipelineJob('sprout') {
        description('Test, analyse (SonarQube), build, push (Docker Hub) and deploy Sprout from the main branch on GitHub.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${SPROUT_REPO_URL}') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
