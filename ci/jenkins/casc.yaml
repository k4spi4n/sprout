jenkins:
  systemMessage: "Sprout CI/CD - configured by Jenkins Configuration as Code (ci/jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sprout-db-password
              description: "Postgres password used by the deployed Sprout stack"
              secret: "${SPROUT_DB_PASSWORD:-sprout}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: >
      pipelineJob('sprout') {
        description('Test, build and deploy Sprout (React + FastAPI + PostgreSQL) from the main branch on GitHub.')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${SPROUT_REPO_URL}') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
