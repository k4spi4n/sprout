# Integration-test override (Jenkins "Integration test" stage).
# Starts the *release images* in an isolated project, without publishing ports, then runs e2e/ against it:
#   docker compose -p sprout-it-<build> -f docker-compose.yml -f docker-compose.it.yml up -d --no-build --wait db backend frontend
#   docker compose -p sprout-it-<build> -f docker-compose.yml -f docker-compose.it.yml run --build e2e
services:
  frontend:
    ports: !reset []   # don't clash with the deployed app on :8090

  e2e:
    image: sprout-e2e:ci
    build: ./e2e
    environment:
      BASE_URL: http://frontend
      EXPECTED_BUILD: ${IMAGE_TAG:-local}
    depends_on:
      frontend:
        condition: service_healthy
