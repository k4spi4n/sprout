# Production-style stack.
#   Jenkins:  IMAGE_NAMESPACE=<dockerhub user> IMAGE_TAG=<build #> docker compose build / up -d --no-build
#   Locally:  docker compose up --build        (images become local/sprout-*:latest)
name: sprout

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprout}
      POSTGRES_DB: ${POSTGRES_DB:-sprout}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"   # on-demand: start with `docker compose up -d`

  backend:
    image: ${IMAGE_NAMESPACE:-local}/sprout-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        APP_BUILD: ${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sprout}:${POSTGRES_PASSWORD:-sprout}@db:5432/${POSTGRES_DB:-sprout}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"   # on-demand: start with `docker compose up -d`

  frontend:
    image: ${IMAGE_NAMESPACE:-local}/sprout-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Checks the whole chain: nginx -> FastAPI -> Postgres
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"   # on-demand: start with `docker compose up -d`

volumes:
  pgdata:
