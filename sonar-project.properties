# SonarQube analysis (Jenkins "SonarQube" stage). Coverage reports come from the "Unit tests" stage.
sonar.projectKey=sprout
sonar.projectName=Sprout
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src,e2e
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.test.inclusions=backend/tests/**,e2e/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/backend/coverage.xml
sonar.javascript.lcov.reportPaths=reports/frontend/coverage/lcov.info

# The separate Jenkins Quality Gate stage waits for the SonarQube webhook.
